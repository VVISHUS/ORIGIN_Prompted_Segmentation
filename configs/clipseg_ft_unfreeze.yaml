# Variant: also train the top CLIP vision layers that feed the decoder, with a Tversky loss that
# penalises missed thin-crack pixels more. Only the keys below differ from the base config.
_base_: clipseg_ft.yaml
experiment: clipseg_ft_unfreeze

model:
  unfreeze_last_n_vision_layers: 3

optim:
  lr: 5.0e-4
  backbone_lr: 1.0e-5

loss:
  terms:
    - {name: bce, weight: 1.0, pos_weight: 2.0}
    - {name: tversky, weight: 1.0, alpha: 0.3, beta: 0.7}
