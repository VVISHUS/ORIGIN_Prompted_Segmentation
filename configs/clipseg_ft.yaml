# Fine-tune CLIPSeg for text-prompted drywall QA segmentation.
# Any value can be overridden from the CLI, e.g.
#   python train.py --config configs/clipseg_ft.yaml --set train.epochs=30 optim.lr=5e-4
experiment: clipseg_ft
seed: 42
deterministic: false            # true = bit-reproducible on GPU, but slower cuDNN kernels
device: auto                    # auto | cuda | cpu
output_dir: runs                # each run → runs/<experiment>-<timestamp>/

data:
  datasets:                     # class name → Roboflow COCO export (class names must match prompts.classes)
    crack: dataset/cracks.v1i.coco
    taping: dataset/Drywall-Join-Detect.v2i.coco
  prepared_dir: work/prepared   # prepare_data.py writes masks/ + index.csv here
  index_csv: work/prepared/index.csv
  split: {train: 0.70, val: 0.15, test: 0.15}   # by source photo: all Roboflow copies share one split
  min_box_size: 2               # px; thinner boxes are degenerate annotations and are dropped
  image_size: null              # null = model's native input size (352 for CLIPSeg)
  balance_classes: true         # equal sampling of crack / taping despite the ~5:1 imbalance
  samples_per_epoch: null       # null = number of train images
  negative_prob: 0.2            # P(image paired with the OTHER class's prompt → empty target)
  num_workers: 2
  augment:                      # probability of each transform (see drywall_seg/augment.py)
    hflip: 0.5
    vflip: 0.5
    rot90: 0.5
    scale_crop: 0.3
    brightness_contrast: 0.5
    hue_saturation: 0.3
    blur: 0.1
    noise: 0.2

prompts:
  primary_prob: 0.5             # share of training samples that use the primary (graded) prompt
  classes:
    crack:
      primary: segment crack
      variants:
        - segment wall crack
        - segment surface crack
        - segment the cracks
        - segment hairline crack
        - crack
        - wall crack
        - cracks in the wall
    taping:
      primary: segment taping area
      variants:
        - segment joint tape
        - segment drywall seam
        - segment drywall joint
        - segment joint compound
        - taping area
        - drywall seam
        - drywall joint tape

model:
  name: clipseg                 # registry key (drywall_seg/models)
  pretrained: CIDAS/clipseg-rd64-refined
  freeze_vision: true
  freeze_text: true
  unfreeze_last_n_vision_layers: 0

loss:
  terms:
    - {name: bce, weight: 1.0, pos_weight: 2.0}
    - {name: dice, weight: 1.0}

optim:
  name: adamw                   # adamw | sgd
  lr: 1.0e-3                    # decoder (~1M params)
  backbone_lr: 1.0e-5           # used only for unfrozen CLIP layers
  weight_decay: 1.0e-4

scheduler:
  name: cosine                  # cosine | constant
  warmup_epochs: 1
  min_lr_ratio: 0.01

train:
  epochs: 20
  batch_size: 16
  amp: true                     # fp16 mixed precision (CUDA only)
  grad_clip: 1.0
  early_stop_patience: 5        # evaluations without val mIoU improvement
  max_steps_per_epoch: null     # set small for smoke tests

eval:
  batch_size: 16
  every: 1                      # evaluate every N epochs
  negatives: true               # also score each image with the other class's prompt (leakage)
  thresholds: [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7]
  max_images: null              # per class; set small for smoke tests
  timing_images: 50
